[project]
name = "job-scraper"
version = "0.1.0"
description = "Scrape job postings from job boards using browser automation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "OpenClaw", email = "dev@openclaw.ai"}
]
license = {text = "MIT"}
keywords = ["job", "scraper", "browser", "automation", "stagehand"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.7",
    "pydantic>=2.0.0",
    "stagehand-py>=0.1.0",
    "playwright>=1.40.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "asyncio>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.24.0",
    "respx>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
